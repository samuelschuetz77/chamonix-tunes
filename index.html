<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b1b1f;--muted:#6b6b76;--line:#e4e2dc;--accent:#d6336c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c20;--ink:#ececf0;--muted:#9a9aa6;--line:#2c2c33;--accent:#ff6b9a}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c20;--ink:#ececf0;--muted:#9a9aa6;--line:#2c2c33;--accent:#ff6b9a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:28px 16px 8px;max-width:900px;margin:0 auto}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
button.t{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
main{max-width:900px;margin:12px auto 0;padding:0 16px 48px}
ul{list-style:none;margin:0;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px}
li a{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:8px;color:inherit;text-decoration:none;white-space:nowrap;overflow:hidden}
li a:hover{background:var(--bg)}
.av{flex:none;width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line)}
.ph{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.ti{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ar{color:var(--muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp{flex:1}
.yt{flex:none;color:var(--accent);font-size:12px}
.empty{color:var(--muted);padding:16px}
footer{max-width:900px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:13px}
</style>
</head>

</header>

const $=s=>document.querySelector(s);
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.codePointAt(0))%360;return h};
const ini=a=>{const w=(a||"?").split(/[\s,]+/).filter(Boolean);const f=[...(w[0]||"?")][0]||"?";const g=w[1]?[...w[1]][0]:"";return(f+(/\p{L}|\p{N}/u.test(g)?g:"")).toUpperCase()};
const lead=a=>(a||"").split(",")[0].trim();
const yt=(t,a)=>"https://music.youtube.com/search?q="+encodeURIComponent(t+" "+a);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#sub").textContent=DATA.length+" songs";
function ph(a){return `<span class="ph" style="background:hsl(${hue(a)} 50% 42%)" aria-hidden="true">${esc(ini(a))}</span>`}
function render(){
  const q=$("#q").value.trim().toLowerCase();
  const rows=DATA.filter(t=>!q||(t[0]+" "+t[1]).toLowerCase().includes(q));
  $("#list").innerHTML=rows.length?rows.map(t=>{
    const a=lead(t[1]);
    const im=t[2]?`<img class="av" loading="lazy" referrerpolicy="no-referrer" alt="" src="${t[2]}" data-a="${esc(a)}">`:ph(a);
    return `<li><a href="${yt(t[0],t[1])}" target="_blank" rel="noopener">${im}<span class="ti">${esc(t[0])}</span><span class="ar">${esc(t[1])}</span><span class="sp"></span><span class="yt">YT Music &#8599;</span></a></li>`}).join(""):`<li class="empty">No matches.</li>`;
}
$("#list").addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"){i.outerHTML=ph(i.dataset.a)}},true);
$("#q").addEventListener("input",render);
$("#theme").addEventListener("click",()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"});
render();
</script>
