<head>

<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b1b1f;--muted:#6b6b76;--line:#e4e2dc;--accent:#d6336c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c20;--ink:#ececf0;--muted:#9a9aa6;--line:#2c2c33;--accent:#ff6b9a}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c20;--ink:#ececf0;--muted:#9a9aa6;--line:#2c2c33;--accent:#ff6b9a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:28px 16px 8px;max-width:1100px;margin:0 auto}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
button.t{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:8px 16px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:12px 0 20px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;padding:16px;min-height:110px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile b{font-size:16px;line-height:1.2}
.tile span{opacity:.85;font-size:13px}
.tile[aria-pressed=true]{box-shadow:0 0 0 3px var(--accent)}
section.list{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 10px;margin-bottom:16px}
section.list h2{margin:10px 12px 4px;font-size:18px}
ul{list-style:none;margin:0;padding:0}
li a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;color:inherit;text-decoration:none;white-space:nowrap;overflow:hidden}
li a:hover{background:var(--bg)}
.av{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.ti{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ar{color:var(--muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp{flex:1}
.yt{flex:none;color:var(--accent);font-size:12px}
.empty{color:var(--muted);padding:16px}
footer{max-width:1100px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:13px}
</style>
</head>

<header>
  <h1>Chamonix Tunes</h1>

    <button class="t" id="all">Show all</button>
    <button class="t" id="theme">Theme</button>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div id="lists"></div>
</main>
<footer>Explicit tracks are left out. Song links open a YouTube Music search. Artist icons are initials.</footer>

const $=s=>document.querySelector(s);
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.codePointAt(0))%360;return h};
const ini=a=>{const w=(a||"?").split(/[\s,]+/).filter(Boolean);const f=[...(w[0]||"?")][0]||"?";const g=w[1]?[...w[1]][0]:"";return(f+(/\p{L}|\p{N}/u.test(g)?g:"")).toUpperCase()};
const lead=a=>(a||"").split(",")[0].trim();
const yt=(t,a)=>"https://music.youtube.com/search?q="+encodeURIComponent(t+" "+a);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let open=new Set(),query="";
const total=DATA.reduce((n,l)=>n+l.tracks.length,0);
$("#sub").textContent=DATA.length+" playlists, "+total+" songs";
function grid(){
  $("#grid").innerHTML=DATA.map((l,i)=>{
    const h=hue(l.name+l.id);
    return `<button class="tile" data-i="${i}" aria-pressed="${open.has(i)}" style="background:linear-gradient(135deg,hsl(${h} 55% 38%),hsl(${(h+50)%360} 60% 28%))"><b>${esc(l.name.replace(/^Chamonix\s*-?\s*/,"")||l.name)}</b><span>${l.tracks.length} songs</span></button>`}).join("");
}
function lists(){
  const q=query.toLowerCase();
  let out="",shown=0;
  DATA.forEach((l,i)=>{
    if(!q&&!open.has(i))return;
    const tr=l.tracks.filter(t=>!q||(t[0]+" "+t[1]).toLowerCase().includes(q));
    if(!tr.length)return;
    shown++;
    out+=`<section class="list"><h2>${esc(l.name)}</h2><ul>`+tr.map(t=>{
      const a=lead(t[1]);
      return `<li><a href="${yt(t[0],t[1])}" target="_blank" rel="noopener"><span class="av" style="background:hsl(${hue(a)} 50% 42%)" aria-hidden="true">${esc(ini(a))}</span><span class="ti">${esc(t[0])}</span><span class="ar">${esc(t[1])}</span><span class="sp"></span><span class="yt">YT Music &#8599;</span></a></li>`}).join("")+`</ul></section>`;
  });
  $("#lists").innerHTML=out||`<div class="empty">${q?"No matches.":"Pick a tile to see its songs."}</div>`;
}
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".tile");if(!b)return;const i=+b.dataset.i;open.has(i)?open.delete(i):open.add(i);grid();lists()});
$("#q").addEventListener("input",e=>{query=e.target.value.trim();lists()});
$("#all").addEventListener("click",()=>{open=open.size===DATA.length?new Set():new Set(DATA.keys());grid();lists()});
$("#theme").addEventListener("click",()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"});
grid();lists();
</script>
